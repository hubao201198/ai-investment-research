name: Norden Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "norden_seed_transcriber.py"
      - "norden_collector_v3.py"
      - "requirements.txt"
      - ".github/workflows/norden-collector.yml"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: norden-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ runner.os }}-${{ env.WHISPER_MODEL }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Download and transcribe verified Norden videos
        env:
          WHISPER_MODEL: "small.en"
          NORDEN_SEED_VIDEO_IDS: "7679312806105156916,7678516691764071732,7678180835652029730,7677804082693672242"
        run: python norden_seed_transcriber.py

      - name: Commit extracted transcripts
        run: |
          git config user.name "ciro-norden-bot"
          git config user.email "ciro-norden-bot@users.noreply.github.com"
          git add data/norden || true
          if git diff --cached --quiet; then
            echo "No new Norden data"
          else
            git commit -m "data: update Norden transcripts"
            git pull --rebase origin main
            git push
          fi
