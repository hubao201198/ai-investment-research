name: Norden Signed Transcribe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "norden_signed_transcriber.py"
      - ".github/workflows/norden-signed-transcribe.yml"

jobs:
  transcribe:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - video_id: "7679312806105156916"
            published_at: "2026-08-29"
          - video_id: "7678516691764071732"
            published_at: "2026-08-27"
          - video_id: "7678180835652029730"
            published_at: "2026-08-26"
          - video_id: "7677804082693672242"
            published_at: "2026-08-25"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve one Norden video using current Douyin signatures
        shell: bash
        env:
          VIDEO_ID: ${{ matrix.video_id }}
          PUBLISHED_AT: ${{ matrix.published_at }}
        run: |
          set -e
          git clone --depth 1 https://github.com/RandallAnjie/Douyin-API.git /tmp/dyapi
          cd /tmp/dyapi
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { buildConfig } from './src/config.js'
          import { fetchOneVideo } from './src/douyin/crawler.js'
          const id=process.env.VIDEO_ID
          const published_at=process.env.PUBLISHED_AT
          const add=(arr,kind,url,rate=null)=>{
            if(url && !arr.some(x=>x.url===url)) arr.push({kind,url,rate})
          }
          let data=null
          let lastErr=null
          for(let attempt=1; attempt<=3; attempt++){
            try{
              const ctx={config:buildConfig({})}
              data=await fetchOneVideo(ctx,id)
              if(data?.aweme_detail) break
            }catch(e){
              lastErr=e
              console.error(`resolve attempt ${attempt} failed:`, e?.message || String(e))
              await new Promise(r=>setTimeout(r, 2500*attempt))
            }
          }
          const a=data?.aweme_detail
          if (!a) throw lastErr || new Error(`no aweme_detail for ${id}`)
          const v=a.video || {}
          const candidates=[]
          add(candidates,'play_addr',(v.play_addr?.url_list||[])[0])
          add(candidates,'play_addr_h264',(v.play_addr_h264?.url_list||[])[0])
          add(candidates,'download_addr',(v.download_addr?.url_list||[])[0])
          add(candidates,'play_addr_265',(v.play_addr_265?.url_list||[])[0])
          const rates=(Array.isArray(v.bit_rate)?v.bit_rate:[])
            .map(x=>({rate:Number(x?.bit_rate||0),url:(x?.play_addr?.url_list||[])[0]}))
            .filter(x=>x.url)
            .sort((a,b)=>a.rate-b.rate)
          for(const r of rates) add(candidates,'bit_rate',r.url,r.rate)
          if (!candidates.length) throw new Error(`no media URLs for ${id}`)
          const out=[{
            video_id:id,
            published_at,
            title:a.desc || '',
            source_url:`https://www.douyin.com/video/${id}`,
            video_urls:candidates.map(x=>x.url),
            stream_candidates:candidates,
          }]
          fs.writeFileSync('/tmp/norden_urls.json', JSON.stringify(out,null,2))
          console.log('resolved',id,a.desc,'candidates=',candidates.length)
          NODE

      - name: Install transcription dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install faster-whisper==1.2.0 requests httpx

      - name: Download audio and transcribe
        env:
          WHISPER_MODEL: "small.en"
          NORDEN_RESOLVED_JSON: "/tmp/norden_urls.json"
          NORDEN_ARTIFACT_DIR: "/tmp/norden_transcripts"
        run: python norden_signed_transcriber.py

      - name: Show transcription status
        run: cat /tmp/norden_transcripts/index.json

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: norden-transcript-${{ matrix.video_id }}
          path: /tmp/norden_transcripts
          if-no-files-found: error
          retention-days: 7
